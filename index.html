    <script id="vite-ws-shield">
      (function () {
        var origError = console.error;
        var origWarn = console.warn;
        function shouldSuppress(args) {
          try {
            var msg = Array.prototype.slice.call(args).map(function (a) {
              return typeof a === 'string' ? a : (a && a.message) ? a.message : String(a);
            }).join(' ');
            return (
              msg.indexOf('failed to connect to websocket') !== -1 ||
              msg.indexOf('WebSocket closed without opened') !== -1 ||
              msg.indexOf('[vite] server connection lost') !== -1
            );
          } catch (e) {
            return false;
          }
        }
        console.error = function () {
          if (shouldSuppress(arguments)) return;
          return origError.apply(console, arguments);
        };
        console.warn = function () {
          if (shouldSuppress(arguments)) return;
          return origWarn.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var text = reason && (reason.message || String(reason)) || '';
          if (
            text.indexOf('WebSocket closed without opened') !== -1 ||
            text.indexOf('failed to connect to websocket') !== -1
          ) {
            event.preventDefault();
          }
        });
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          var PatchedWebSocket = function (url, protocols) {
            var isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && url.indexOf('token=') !== -1);
            if (isViteHmr) {
              var target = new EventTarget();
              target.url = String(url || '');
              target.readyState = 1;
              target.protocol = 'vite-hmr';
              target.extensions = '';
              target.bufferedAmount = 0;
              target.binaryType = 'blob';
              target.OPEN = 1;
              target.CONNECTING = 0;
              target.CLOSING = 2;
              target.CLOSED = 3;
              target.send = function () {};
              target.close = function () {
                target.readyState = 3;
              };
              setTimeout(function () {
                try {
                  var openEv = new Event('open');
                  if (typeof target.onopen === 'function') target.onopen(openEv);
                  target.dispatchEvent(openEv);
                  var msgEv = new MessageEvent('message', { data: JSON.stringify({ type: 'connected' }) });
                  if (typeof target.onmessage === 'function') target.onmessage(msgEv);
                  target.dispatchEvent(msgEv);
                } catch (e) {}
              }, 10);
              return target;
            }
            return protocols !== undefined
              ? new NativeWebSocket(url, protocols)
              : new NativeWebSocket(url);
          };
          PatchedWebSocket.prototype = NativeWebSocket.prototype;
          PatchedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = NativeWebSocket.OPEN;
          PatchedWebSocket.CLOSING = NativeWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }
      })();
    </script>

    <script>
      (function () {
        // Silently suppress unhandled websocket errors in AI Studio preview environment
        window.addEventListener("unhandledrejection", function (event) {
          var reason = event && event.reason;
          var msg = typeof reason === "string" ? reason : (reason && reason.message) || "";
          if (msg.indexOf("WebSocket") !== -1 || msg.indexOf("websocket") !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        var origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var isViteWs = args.some(function (arg) {
            var str = typeof arg === "string" ? arg : (arg && arg.message) || String(arg);
            return str.indexOf("[vite] failed to connect to websocket") !== -1 ||
                   str.indexOf("WebSocket closed without opened") !== -1;
          });
          if (isViteWs) return;
          origConsoleError.apply(console, args);
        };

        // Analytics Panosu <-> Ana Portal (React) Canlı 24 Saat Senkronizasyon Köprüsü
        var SYNC_STORAGE_KEY = "sciphi_analytics_sync_state";
        var syncChannel = typeof BroadcastChannel !== "undefined" ? new BroadcastChannel("sciphi_analytics_channel") : null;
        var latestTotals = { sumReads: 73280, sumViews: 103604 };

        function readStoredSyncState() {
          try {
            var raw = localStorage.getItem(SYNC_STORAGE_KEY);
            if (!raw) return null;
            return JSON.parse(raw);
          } catch (e) {
            return null;
          }
        }

        function notifyUpdate(reads, views) {
          var r = Math.max(latestTotals.sumReads, Number(reads) || 0);
          var v = Math.max(latestTotals.sumViews, Number(views) || 0);
          latestTotals.sumReads = r;
          latestTotals.sumViews = v;
          try {
            window.dispatchEvent(new CustomEvent("sciphi:analytics-updated", { detail: latestTotals }));
          } catch (e) {}
        }

        var stored = readStoredSyncState();
        if (stored && (stored.sumReads || stored.sumViews)) {
          notifyUpdate(stored.sumReads, stored.sumViews);
        }

        if (syncChannel) {
          syncChannel.onmessage = function (event) {
            var payload = event.data;
            if (payload && (payload.sumReads || payload.sumViews)) {
              notifyUpdate(payload.sumReads, payload.sumViews);
            }
          };
        }

        window.addEventListener("storage", function (e) {
          if (e.key === SYNC_STORAGE_KEY && e.newValue) {
            try {
              var parsed = JSON.parse(e.newValue);
              if (parsed && (parsed.sumReads || parsed.sumViews)) {
                notifyUpdate(parsed.sumReads, parsed.sumViews);
              }
            } catch (err) {}
          }
        });
      })();
    </script>
